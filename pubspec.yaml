name: city_dashboard
description: Honda City Hatchback dashboard with clearly labeled simulated telemetry.
publish_to: none
version: 0.5.0+5
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  flutter_svg: ^2.2.1
  just_audio: ^0.10.5
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/audio/
    - assets/icons/
  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat.ttf
